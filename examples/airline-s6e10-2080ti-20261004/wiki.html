      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

&lt;script type=&quot;application/json&quot; id=&quot;wk-data&quot;&gt;{&quot;revision&quot;: &quot;fb8a04195f088e15f4e30f21&quot;, &quot;updated_at&quot;: &quot;2026-10-04T18:01:07+00:00&quot;, &quot;exported_at&quot;: &quot;2026-10-04T18:21:17+00:00&quot;, &quot;protocol&quot;: &quot;3809e829ce612de2b66a&quot;, &quot;claims&quot;: [{&quot;id&quot;: &quot;starter-validation-measurement&quot;, &quot;title&quot;: &quot;Untouched starter validation measurement&quot;, &quot;kind&quot;: &quot;observation&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;The untouched starter scored ROC-AUC 0.9572004065863107 on the frozen validation set; the recorded run used 400 GPU CatBoost trees and completed the candidate in 4.7448 seconds. This is a single measurement, not evidence of improvement or a mechanism.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; frozen validation protocol, 489,744 training rows and 104,945 search-validation rows; RTX 2080 Ti physical index 1/logical device 0; starter configuration, seed 20261004, 180-second cap.&quot;, &quot;supports&quot;: [&quot;e-63f527c11cd4620a00b3c393&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;GPU CatBoost is not bitwise deterministic, and the score may vary across runs.&quot;, &quot;The separate task-brief starter measurement differs; measurements need not be directly comparable.&quot;], &quot;next_test&quot;: &quot;Compare prespecified feature ablations against matched starter runs on the frozen validation protocol, repeating seeds where feasible to estimate run variation before deciding whether a difference is meaningful.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T10:14:59+00:00&quot;}, {&quot;id&quot;: &quot;catboost-gpu-nondeterminism&quot;, &quot;title&quot;: &quot;CatBoost documentation describes GPU training as nondeterministic&quot;, &quot;kind&quot;: &quot;experience&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;The supplied CatBoost GPU documentation attributes nondeterministic training to floating-point summation order. This supports treating GPU score variation as possible but does not quantify variation for this task.&quot;, &quot;scope&quot;: &quot;CatBoost GPU training as described in the supplied documentation excerpt; no airline-specific score, configuration, or noise estimate.&quot;, &quot;supports&quot;: [&quot;e-19a209702a616e0cdc6a924e&quot;, &quot;e-3674965902fffbb1cccb7a0d&quot;, &quot;e-ab0caf3bac9abf38f3d4e681&quot;, &quot;e-e51e973482c1fdc119bf73aa&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The documentation does not establish that any particular observed score difference is due to nondeterminism.&quot;, &quot;Variation may also arise from differences in data, software, or execution configuration.&quot;, &quot;The excerpt is documentation evidence, not an independent experimental replication.&quot;], &quot;next_test&quot;: &quot;Repeat identical paired starter and feature-ablation runs with recorded seeds and configuration to estimate variation under the task protocol.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T10:43:03+00:00&quot;}, {&quot;id&quot;: &quot;rating-summary-split-hypothesis&quot;, &quot;title&quot;: &quot;Rating summaries may provide useful tree splits&quot;, &quot;kind&quot;: &quot;hypothesis&quot;, &quot;status&quot;: &quot;untested&quot;, &quot;statement&quot;: &quot;An overall service-rating mean may improve ROC-AUC over raw features at starter settings. Two same-seed quick blocks favored mean-only over raw, and one adaptive search-validation mean run scored 0.9572675016680855; its difference from a separate valid root measurement was +0.0000670951. This does not establish a reliable validation improvement or a split-selection mechanism.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; proposed rating-summary feature ablation versus the 400-tree GPU CatBoost starter on frozen validation data, under the same training pool and 180-second cap; no results supplied.&quot;, &quot;supports&quot;: [&quot;e-a88a499c59ab3499d264d09e&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The validation comparison is not a fresh matched control; its small difference may reflect GPU/run variation.&quot;, &quot;Adaptive selection and quick results may overstate transfer to validation.&quot;, &quot;A mean may alter finite-model split competition, but AUC alone cannot identify that mechanism.&quot;, &quot;Evidence for the mean does not establish utility of dispersion, contrasts, or segment interactions.&quot;], &quot;next_test&quot;: &quot;Run paired, prespecified mean-only and raw validation comparisons with repeated seeds where feasible. Distinguish mean-feature utility from run variation and adaptive-selection effects; change the default only if matched results support a practically relevant difference.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T10:14:59+00:00&quot;}, {&quot;id&quot;: &quot;quick-rating-summary-ablation&quot;, &quot;title&quot;: &quot;Quick scores for raw ratings, mean-only, and full-profile feature modes&quot;, &quot;kind&quot;: &quot;observation&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;On the frozen quick split, the n002 mean-only arm scored ROC-AUC 0.9529834489267927 versus 0.9525373326142099 for raw features and 0.9523817935601727 for the full profile. The mean-over-raw difference was +0.0004461, close to the n001 difference of +0.0004461. Both same-seed blocks ranked mean above raw above profile; this is directional repeatability on one split, not independent-seed replication or evidence of a mechanism.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; frozen quick split, 50,000 training and 10,000 development rows; seed 20261004; RTX 2080 Ti physical index 1/logical 0; 400-tree depth-6 GPU CatBoost; three single-run arms, 60-second cap.&quot;, &quot;supports&quot;: [&quot;e-a88a499c59ab3499d264d09e&quot;, &quot;e-a991bea26e83fa3a5a1836d7&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The two blocks use the same seed and split and are not independent replication; GPU variation remains unquantified.&quot;, &quot;Feature modes alter multiple inputs, so score differences do not identify which features matter or why.&quot;, &quot;Quick results do not establish validation or final-set benefit.&quot;], &quot;next_test&quot;: &quot;Run prespecified paired repeats with distinct recorded seeds if the quick interface permits, and compare raw, mean-only, and profile arms. Distinguish repeatable feature-mode differences from GPU/run variation; change the default only if the differences remain decision-relevant.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T10:14:59+00:00&quot;}, {&quot;id&quot;: &quot;full-profile-versus-raw-quick&quot;, &quot;title&quot;: &quot;Full service-profile features scored below raw features in two quick blocks&quot;, &quot;kind&quot;: &quot;observation&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;The n002 full-profile arm scored 0.9523817935601727 versus 0.9525373326142099 for raw features, a difference of -0.0001555 ROC-AUC. The earlier n001 difference was -0.0000804. Both single-seed blocks ranked the tested profile below raw; they do not establish a reliable disadvantage or identify an individual feature effect.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; frozen quick split, 50,000 training and 10,000 development rows; seed 20261004; RTX 2080 Ti physical index 1/logical 0; 400-tree depth-6 GPU CatBoost; full-profile versus raw single-run comparison, 60-second cap.&quot;, &quot;supports&quot;: [&quot;e-a88a499c59ab3499d264d09e&quot;, &quot;e-a991bea26e83fa3a5a1836d7&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The blocks share seed and split and do not estimate independent-seed variation.&quot;, &quot;The profile bundles multiple summaries, so redundancy or split competition may explain its score without any one feature being harmful.&quot;, &quot;A small observed difference may be run variation.&quot;], &quot;next_test&quot;: &quot;Repeat the prespecified profile-versus-raw comparison with distinct seeds and isolate profile components only if the bundle difference is stable. Distinguish bundle-level reproducibility from individual feature effects; omit the bundle only if repeated evidence supports that decision.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T10:14:59+00:00&quot;}, {&quot;id&quot;: &quot;catboost-greedy-tree-structure-docs&quot;, &quot;title&quot;: &quot;CatBoost documentation describes greedy tree construction and symmetric trees&quot;, &quot;kind&quot;: &quot;experience&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;The supplied CatBoost documentation describes greedy tree construction and states that SymmetricTree builds level by level, splitting leaves at a level under a shared condition. This is design context only; it does not establish that any added rating summary or interaction improves airline ROC-AUC or works through a particular split-selection mechanism.&quot;, &quot;scope&quot;: &quot;CatBoost tree-structure selection as described in the supplied documentation excerpt; no airline-specific dataset, configuration, score, or feature-ablation result.&quot;, &quot;supports&quot;: [&quot;e-694e6783426c23859e7cc77f&quot;, &quot;e-6a67c84e9cf53d815f701619&quot;, &quot;e-80183cd00c072c1a68f8156d&quot;, &quot;e-dfd3086fc47b41f87056d7e4&quot;, &quot;e-f1cd25f0549c37e5830df239&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;Documentation describes algorithm design, not the effect of a feature intervention.&quot;, &quot;Score differences could reflect run variation or other consequences of changing the feature set.&quot;, &quot;Literature novelty is unknown without relevant literature sources.&quot;], &quot;next_test&quot;: &quot;Compare prespecified raw-rating and summary or interaction arms under identical settings with paired repeats; inspect selected splits separately if available. Distinguish score changes from the proposed split-selection explanation.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T15:29:39+00:00&quot;}, {&quot;id&quot;: &quot;n002-mean-validation-measurement&quot;, &quot;title&quot;: &quot;Mean-feature arm validation measurements&quot;, &quot;kind&quot;: &quot;observation&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;The n002 mean-feature arm scored ROC-AUC 0.9572675016680855 with recorded candidate elapsed time 4.8972 seconds. In n004, the restored mean/400 configuration scored 0.9572919711976331; candidate elapsed time was 4.9475 seconds. These are separate measurements of the same configuration, not a matched feature ablation or evidence of improvement or mechanism.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; n002 frozen search-validation evaluation, 489,744 training rows and 104,945 scoring rows; overall mean of 13 service ratings added to raw features; 400-tree depth-6 learning-rate-0.08 GPU Plain CatBoost, seed 20261004, RTX 2080 Ti physical index 1/logical device 0, 180-second cap.&quot;, &quot;supports&quot;: [&quot;e-67f4d6ec016c302d3bd22746&quot;, &quot;e-a88a499c59ab3499d264d09e&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The measurements are separate runs; their small score difference may reflect GPU or run variation.&quot;, &quot;These are adaptive search-validation measurements, not independent confirmation.&quot;, &quot;Neither measurement identifies a mechanism or establishes performance on the sealed final set.&quot;], &quot;next_test&quot;: &quot;Run matched raw-feature and mean-feature validation arms under the same protocol with repeated recorded seeds. Distinguish a stable mean-feature score difference from run variation; retain the mean only if matched evidence supports a decision-relevant difference.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T10:55:37+00:00&quot;}, {&quot;id&quot;: &quot;n003-digital-segments-validation-measurement&quot;, &quot;title&quot;: &quot;Digital-segment feature arm validation score and runtime&quot;, &quot;kind&quot;: &quot;observation&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;The n003 digital-segment arm scored ROC-AUC 0.9573126801034795 on frozen search-validation rows. Candidate elapsed time was 5.1972 seconds, below the 180-second cap. The score was +0.0000452 versus the n002 mean-feature measurement, but this was not a fresh matched comparison and does not establish improvement or mechanism.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; n003 frozen search-validation evaluation, 489,744 training rows and 104,945 scoring rows; overall service mean, digital-service mean, and digital mean gated by business travel, loyal customer, and business class; 400-tree depth-6 learning-rate-0.08 GPU Plain CatBoost, seed 20261004, RTX 2080 Ti physical index 1/logical device 0, 180-second cap.&quot;, &quot;supports&quot;: [&quot;e-29cb1794b2c71490a0d6e4a8&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The comparison to n002 is unmatched and the small difference may reflect GPU/run variation.&quot;, &quot;This is adaptive search-validation evidence, not independent confirmation.&quot;, &quot;The arm combines multiple feature changes and does not identify an individual gate effect or mechanism.&quot;], &quot;next_test&quot;: &quot;Run matched validation arms for overall mean alone, overall plus ungated digital mean, and overall plus the three gates, using repeated recorded seeds where feasible. Distinguish gate utility from ungated-feature effects and run variation; change the default only if the net difference is repeatable and decision-relevant.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T10:36:49+00:00&quot;}, {&quot;id&quot;: &quot;n003-digital-gates-quick-ablation&quot;, &quot;title&quot;: &quot;Reversed-order quick block repeats the digital-gate score ordering&quot;, &quot;kind&quot;: &quot;observation&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;In n005&#x27;s reversed C/B/A quick block, the overall-mean arm scored 0.9529834894, the ungated digital-mean arm 0.9524785041, and the gated arm 0.9530102702. The gated arm exceeded the baseline by 0.0000268 and the ungated arm by 0.0005318; the ungated arm was 0.0005050 below baseline. These differences closely repeat n003&#x27;s same-seed, same-split A/B/C block, but the blocks are not independent replication and do not establish reliable effects.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; frozen quick split, 50,000 training and 10,000 scoring-only development rows; n003 ordered A/B/C arms, seed 20261004, RTX 2080 Ti physical index 1/logical device 0; 400-tree depth-6 learning-rate-0.08 GPU Plain CatBoost, 60-second cap.&quot;, &quot;supports&quot;: [&quot;e-29cb1794b2c71490a0d6e4a8&quot;, &quot;e-a872fdf892d6b4233248a75f&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;Both blocks use the same seed and quick split, so their close agreement is not independent replication.&quot;, &quot;Extra numeric columns may alter split competition without encoding useful segment interactions.&quot;, &quot;The small gated-versus-baseline difference may be run variation; the harness diagnostic is heuristic-only.&quot;], &quot;next_test&quot;: &quot;Repeat the prespecified A/B/C comparison in paired blocks with distinct recorded seeds. Distinguish repeatable feature-mode differences from GPU/run variation and same-split dependence; change the feature default only if the net baseline comparison is reproducible and decision-relevant.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T11:16:45+00:00&quot;}, {&quot;id&quot;: &quot;digital-gates-may-help-fixed-capacity-model&quot;, &quot;title&quot;: &quot;Digital-service gates repeat a small quick-score increment but miss the adoption margin&quot;, &quot;kind&quot;: &quot;hypothesis&quot;, &quot;status&quot;: &quot;mixed&quot;, &quot;statement&quot;: &quot;In n005, the gated bundle scored above both the overall-mean baseline and ungated digital-mean arm in a reversed-order quick block; the signs and near-identical differences also appeared in n003. However, the n005 gated-minus-baseline difference (+0.0000268) was below its prospectively specified 0.0002 engineering adoption margin. The evidence does not support retaining this bundle as the default under that decision rule, nor establish that all gates lack value or identify a segment mechanism.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; proposed comparison of overall service mean against that baseline plus digital-service mean gated by business travel, loyalty, and class; 400-tree depth-6 learning-rate-0.08 GPU Plain CatBoost under the frozen quick and search-validation protocols; existing evidence uses seed 20261004 and is not a matched repeated validation comparison.&quot;, &quot;supports&quot;: [&quot;e-29cb1794b2c71490a0d6e4a8&quot;, &quot;e-a872fdf892d6b4233248a75f&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;Gates may expose useful finite-depth split directions conditional on the ungated digital mean, without improving net score over the overall-mean baseline.&quot;, &quot;Added columns may change numeric borders or greedy split competition without useful semantic interaction value.&quot;, &quot;Same-split, same-seed blocks do not estimate independent-seed variation or validate the segment constructs.&quot;, &quot;The 0.0002 threshold is an engineering adoption rule, not a noise estimate or statistical significance threshold.&quot;], &quot;next_test&quot;: &quot;If reconsidering the bundle, run prespecified paired repeats with distinct seeds and a matched validation A/B/C comparison. Distinguish net gate utility from run variation, ungated-feature effects, and added-column split competition; change the default only if the prespecified practical margin is met reproducibly.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T11:16:45+00:00&quot;}, {&quot;id&quot;: &quot;ungated-digital-mean-not-beneficial-in-n003-quick-block&quot;, &quot;title&quot;: &quot;Ungated digital mean scored below the overall-mean arm in one quick block&quot;, &quot;kind&quot;: &quot;observation&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;In the n003 quick block, adding an ungated digital-service mean to the overall service mean scored 0.0005050 ROC-AUC below the overall-mean arm. This single comparison does not establish a reliable disadvantage or imply that digital summaries are universally unhelpful.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; frozen quick split, 50,000 training and 10,000 scoring-only development rows; n003 overall-mean versus overall-plus-ungated-digital-mean arms, seed 20261004, RTX 2080 Ti physical index 1/logical device 0; 400-tree depth-6 learning-rate-0.08 GPU Plain CatBoost, 60-second cap.&quot;, &quot;supports&quot;: [&quot;e-29cb1794b2c71490a0d6e4a8&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;One run per arm cannot quantify GPU variation.&quot;, &quot;The score difference may reflect finite-model split competition rather than harmful information in the feature.&quot;, &quot;The quick result does not establish the effect on validation or final data.&quot;], &quot;next_test&quot;: &quot;Repeat matched overall-mean and ungated-digital-mean arms with distinct seeds. Distinguish a stable ungated-feature penalty from run variation and interactions with the gated bundle; omit the ungated feature only if repeated comparisons support that choice.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T10:36:49+00:00&quot;}, {&quot;id&quot;: &quot;n004-fixed1600-capacity-quick-outcome&quot;, &quot;title&quot;: &quot;Quick scores for fixed-400 and fixe arameter effect.&quot;, &quot;supports&quot;: [&quot;e-1e647e8ab2fa569e6823e086&quot;, &quot;e-207a732cc9bd82b1f5c91346&quot;, &quot;e-80183cd00c072c1a68f8156d&quot;, &quot;e-9d1392e76aeb95791ff0ee50&quot;, &quot;e-cf8b600834398ec2d98bb197&quot;, &quot;e-e2ca43fce116d81fcf1ca67d&quot;, &quot;e-f003dbad00dd4f03847237bd&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The excerpts are mutable documentation, not a pinned description of the installed CatBoost version.&quot;, &quot;Documented parameter semantics and GPU support do not establish task-specific benefit, runtime, or memory feasibility.&quot;, &quot;Parameter descriptions do not identify a mechanism for any observed score difference.&quot;], &quot;next_test&quot;: &quot;Compare a prespecified supported growth policy and leaf-search setting with a matched SymmetricTree control under the frozen airline protocol. Distinguish policy-associated score changes from run variation; only measured task-specific comparisons support performance claims.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T16:42:14+00:00&quot;}, {&quot;id&quot;: &quot;learning-rate-iteration-trajectory-airline&quot;, &quot;title&quot;: &quot;Changing learning-rate and iteration trajectories may change airline ROC-AUC&quot;, &quot;kind&quot;: &quot;hypothesis&quot;, &quot;status&quot;: &quot;untested&quot;, &quot;statement&quot;: &quot;A controlled learning-rate and iteration-count comparison may identify a more useful training trajectory for the frozen airline task. Whether any trajectory improves ROC-AUC, and why, is untested; the documentation excerpts provide rationale for varying these parameters but no task-specific evidence.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; frozen training and evaluation protocol on RTX 2080 Ti physical index 1/logical device 0; GPU CatBoost, with candidate learning-rate and iteration settings to be prespecified within the authorized budget; no task-specific trajectory measuremen rt models scored ROC-AUC 0.9577150798991513 on search validation, using 489,744 training rows and 104,945 scoring rows. Whole-candidate time was 10.1621 seconds. It was 0.0000053590 below historical n008 and missed the preregistered +0.0002 adoption threshold. Exact full-pool component and continuation scores were not supplied. This measurement does not establish an averaging mechanism or practical improvement.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; n013 frozen search-validation evaluation, 489,744 training rows and 104,945 scoring rows; raw features plus service_mean; equal raw-margin average of two 400-tree depth-8, learning-rate-0.08, L2=10 GPU Plain SymmetricTree CatBoost models at seeds 20261004 and 20261005; RTX 2080 Ti physical index 1/logical device 0; 180-second cap.&quot;, &quot;supports&quot;: [&quot;e-91457c6271f25982c7045c5b&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The historical n008 comparison is not contemporaneous and cannot isolate the effect of restart averaging.&quot;, &quot;The supplied full-pool result does not include scores for the exact A, B, or 800-tree continuation arms.&quot;, &quot;GPU variation is unquantified; the small historical contrast may reflect run variation.&quot;, &quot;The quick development comparison and full-pool evaluation differ in training and scoring populations.&quot;], &quot;next_test&quot;: &quot;If restart averaging remains decision-relevant, measure its components and a prespecified continuation control in separate authorized harness evaluations under matched full-pool conditions. This distinguishes averaging utility from component and training-path differences; change the decision only on matched measurements meeting a prespecified practical rule.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T15:21:37+00:00&quot;}, {&quot;id&quot;: &quot;n013-fixed-restart-practical-benefit&quot;, &quot;title&quot;: &quot;Fixed restart average did not meet its practical adoption screen&quot;, &quot;kind&quot;: &quot;hypothesis&quot;, &quot;status&quot;: &quot;mixed&quot;, &quot;statement&quot;: &quot;For n013, the quick-block restart average did not exceed the stronger component by the prespecified 0.0002 margin, while it exceeded the 800-tree continuation control. On search validation, the average missed its prespecified historical-n008-plus-0.0002 adoption threshold. The evidence opposes practical adoption of this fixed configuration under the stated screens, but does not establish that restart averaging is generally ineffective or identify why scores differed.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; n013 comparison of equal raw-margin averaging of 400-tree models at seeds 20261004 and 20261005 against each component and an 800-tree continuation at seed 20261004; quick split of 50,000 training and 10,000 scoring-only rows and frozen search validation of 489,744 training and 104,945 scoring rows; numeric features plus service_mean; depth 8, learning rate 0.08, L2=10 GPU Plain SymmetricTree CatBoost; RTX 2080 Ti physical index 1/logical device 0; quick cap 60 seconds and validation cap 180 seconds.&quot;, &quot;supports&quot;: [&quot;e-91457c6271f25982c7045c5b&quot;], &quot;opposes&quot;: [&quot;e-91457c6271f25982c7045c5b&quot;], &quot;alternatives&quot;: [&quot;The quick average exceeded the continuation but not the stronger component; avoiding an adverse continuation result could account for that contrast without demonstrating restart complementarity.&quot;, &quot;A weaker component may dilute the average; prediction-error correlation and complementarity were not measured.&quot;, &quot;GPU variation, finite-sample ranking, and differences between quick and full-pool populations may affect the observed ordering.&quot;, &quot;The comparison with historical n008 does not isolate restart averaging from inherited features and configuration.&quot;], &quot;next_test&quot;: &quot;Only reconsider this configuration if separate authorized evaluations provide matched full-pool component and continuation comparisons, with prespecified practical thresholds and repeated paired seeds if feasible. This distinguishes component dilution and training-path effects from averaging utility and run variation; retain it only if matched results meet the practical rule.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T15:21:37+00:00&quot;}, {&quot;id&quot;: &quot;catboost-gradient-boosting-score-documentation&quot;, &quot;title&quot;: &quot;CatBoost documentation describes sequential gradient boosting and split-score choices&quot;, &quot;kind&quot;: &quot;experience&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;The collected CatBoost documentation says trees are built sequentially to approximate negative loss gradients and describes score_function as a criterion used to select splits. It lists GPU support for all score types in the excerpt. This is API and algorithm context, not evidence that any score function or feature intervention improves airline ROC-AUC.&quot;, &quot;scope&quot;: &quot;CatBoost score-function and gradient-boosting descriptions in the collected documentation excerpt captured 2026-10-04; no airline-specific configuration, measured effect, or pinned source revision.&quot;, &quot;supports&quot;: [&quot;e-f653a1643ebe2654fbe2f15b&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The excerpt is documentation evidence rather than an independent implementation test.&quot;, &quot;Supported GPU score types do not establish compatibility with every configuration or useful task-specific performance.&quot;, &quot;The excerpt omits equations and notation-dependent detail.&quot;], &quot;next_test&quot;: &quot;If score-function behavior becomes a research question, compare prespecified settings with matched data, features, and budgets. Distinguish score-function effects from run variation; do not infer a mechanism from AUC alone.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T15:29:39+00:00&quot;}, {&quot;id&quot;: &quot;n014-raw-only-depth8-validation-measurement&quot;, &quot;title&quot;: &quot;Raw-only depth-8/L2=10 scored 0.9577846 on search validation&quot;, &quot;kind&quot;: &quot;observation&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;The n014 raw-only arm scored ROC-AUC 0.9577845705966306 on search validation, using 489,744 training rows and 104,945 scoring rows. Whole-candidate time was 6.0982 seconds. Its score was 0.0000641316 above the historical n008 raw-plus-service_mean score, within the prespecified 0.0002 engineering margin; this is not evidence of equivalence or a mechanism.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; n014 frozen search-validation evaluation, 489,744 training rows and 104,945 scoring rows; 21 raw predictors including four native categories, without ID, target, or service_mean; 400-tree depth-8, L2=10, learning-rate-0.08 GPU Plain SymmetricTree CatBoost, seed 20261004, RTX 2080 Ti physical index 1/logical device 0; 180-second cap.&quot;, &quot;supports&quot;: [&quot;e-6cd38922818d8abed0b71a18&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The historical n008 mean-feature arm is not a fresh matched control, so the small observed difference may reflect GPU variation or run conditions.&quot;, &quot;The raw-only arm scored lower than the historical mean-feature arm on quick; the reversal may depend on training or scoring population, or their combination.&quot;, &quot;Removing a column changes the candidate feature set and greedy boosting path; the score alone does not identify why the result occurred.&quot;], &quot;next_test&quot;: &quot;Run a fresh mean-feature control at identical settings and full-pool protocol. This distinguishes the effect of removing service_mean from historical-control and GPU variation; change the feature choice only if the matched result changes the prespecified practical decision.&quot;, &quo o not identify why they occurred.&quot;], &quot;next_test&quot;: &quot;If the small full-pool contrast affects the feature decision, run further matched raw-versus-mean full-pool comparisons with predeclared recorded seeds. This distinguishes persistent feature-associated ordering from GPU variation; change the decision only if results meet a prespecified practical rule.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T16:08:29+00:00&quot;}, {&quot;id&quot;: &quot;catboost-gpu-training-nondeterminism-documentation&quot;, &quot;title&quot;: &quot;Collected CatBoost documentation describes GPU training as nondeterministic&quot;, &quot;kind&quot;: &quot;experience&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;Collected CatBoost documentation excerpts state that GPU training is nondeterministic because floating-point summations may occur in a nondeterministic order. The newer excerpt also describes GPU device IDs as zero-based, consistent with using logical device 0 under the authorized mask. These documentation statements do not provide an airline-specific variance estimate or significance threshold.&quot;, &quot;scope&quot;: &quot;CatBoost GPU training documentation excerpt captured 2026-10-04; no pinned source revision or task-specific estimate of score variation.&quot;, &quot;supports&quot;: [&quot;e-0230e1342ecdc9f92e56daad&quot;, &quot;e-69071d65629d2ddd4239105e&quot;], &quot;opposes&quot;: [], &quot;alternatives&quot;: [&quot;The excerpts are mutable documentation and may not exactly characterize the installed CatBoost version.&quot;, &quot;They give no magnitude or distribution for ROC-AUC variation on this task.&quot;, &quot;A score contrast may reflect configuration, run variation, or both.&quot;], &quot;next_test&quot;: &quot;Use paired recorded-seed repetitions for decision-relevant GPU configuration contrasts where budget permits. Distinguish persistent ordering from observed run variation; do not treat the documentation stat ice depends on this small contrast. This distinguishes persistent ordering from run variation; retain a feature choice only if the paired results satisfy the practical decision rule.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T16:08:29+00:00&quot;}, {&quot;id&quot;: &quot;n015-raw-mean-practical-separation&quot;, &quot;title&quot;: &quot;Fresh full-pool raw and mean scores fell within the practical action margin&quot;, &quot;kind&quot;: &quot;hypothesis&quot;, &quot;status&quot;: &quot;mixed&quot;, &quot;statement&quot;: &quot;The n015 practical prediction was met in the single full-pool realization: the fresh mean score was within 0.0002 of the n014 raw score. The quick comparison opposed that prediction, favoring mean by 0.0004148383. This mixed evidence does not establish equivalence, stable feature utility, or general service_mean redundancy.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; n015 raw-versus-mean comparison against n014 raw reference; frozen quick split (50,000 training and 10,000 scoring-only rows) and search validation (489,744 training and 104,945 scoring rows); 400-tree depth-8, L2=10, learning-rate-0.08 GPU Plain SymmetricTree CatBoost, seed 20261004, RTX 2080 Ti physical index 1/logical device 0; 0.0002 absolute AUC action margin; quick 60-second and validation 180-second caps.&quot;, &quot;supports&quot;: [&quot;e-965fbcee80bf46cdd774d161&quot;], &quot;opposes&quot;: [&quot;e-965fbcee80bf46cdd774d161&quot;], &quot;alternatives&quot;: [&quot;The single full-pool contrast may be affected by GPU variation.&quot;, &quot;Training and scoring populations both differ between quick and validation, preventing attribution of their reversal.&quot;, &quot;The practical margin is an engineering convention, not a statistical equivalence test.&quot;], &quot;next_test&quot;: &quot;Repeat matched raw-versus-mean full-pool comparisons under predeclared paired seeds. This distinguishes a practically small persistent contrast from seed/run varia er mechanism.&quot;], &quot;next_test&quot;: &quot;If growth policy remains decision-relevant, run a fresh matched SymmetricTree control and prespecified Depthwise comparison under the same full-pool protocol, with paired recorded seeds where feasible. This distinguishes a persistent policy-associated ordering from run variation and historical-control differences; change the choice only if results meet a predeclared practical rule.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T16:34:19+00:00&quot;}, {&quot;id&quot;: &quot;n016-depthwise-practical-benefit&quot;, &quot;title&quot;: &quot;Depthwise did not meet its predeclared practical-improvement threshold&quot;, &quot;kind&quot;: &quot;hypothesis&quot;, &quot;status&quot;: &quot;refuted&quot;, &quot;statement&quot;: &quot;The n016 prediction that raw-feature Depthwise/min_data_in_leaf=1 would exceed the n014 SymmetricTree validation score by at least 0.0002 was not met: the observed difference was +0.0001394425. This rejects that scoped adoption prediction, not smaller persistent utility, other Depthwise settings, or a passenger-interaction mechanism.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; n016 designated Depthwise/min_data_in_leaf=1 versus immutable n014 raw-only SymmetricTree reference; frozen search validation with 489,744 training and 104,945 scoring rows; 21 raw predictors including four native categories, without ID or target; 400-tree depth-8, L2=10, learning-rate-0.08 GPU Plain CatBoost, seed 20261004, RTX 2080 Ti physical index 1/logical device 0; 180-second cap; practical threshold +0.0002.&quot;, &quot;supports&quot;: [], &quot;opposes&quot;: [&quot;e-7f750b5c9b9715c1340448b1&quot;], &quot;alternatives&quot;: [&quot;GPU variation is unquantified, and the comparison uses a historical rather than contemporaneous control.&quot;, &quot;The heuristic harness comparison was classified uncertain and is not a significance certificate.&quot;, &quot;Quick and validation orderings reverse, but ation orderings differ, but their training and scoring populations differ too, so the reversal does not identify a population effect.&quot;, &quot;Policy-associated data partition and realized tree complexity differed; AUC does not isolate policy from those changes or identify passenger-segment utility.&quot;], &quot;next_test&quot;: &quot;If choosing between policies remains consequential, run fresh matched policy arms with paired recorded seeds under the same full-pool protocol. This distinguishes persistent policy-associated ordering from GPU/run variation; change the choice only if a prespecified practical rule is met.&quot;, &quot;updated_at&quot;: &quot;2026-10-04T17:08:33+00:00&quot;}, {&quot;id&quot;: &quot;n017-symmetric-depthwise-practical-proximity&quot;, &quot;title&quot;: &quot;Fresh SymmetricTree met the prespecified proximity margin to Depthwise&quot;, &quot;kind&quot;: &quot;hypothesis&quot;, &quot;status&quot;: &quot;supported&quot;, &quot;statement&quot;: &quot;The n017 practical prediction was met in one fixed-seed full-pool realization: fresh SymmetricTree scored 0.0001394425 below immutable n016 Depthwise, within the strict absolute 0.0002 proximity interval. This supports the scoped proximity prediction only; it does not establish equivalence, stable ordering, or a mechanism. The earlier Depthwise adoption prediction of at least +0.0002 over n014 remains unmet.&quot;, &quot;scope&quot;: &quot;Airline satisfaction S6E10; n017 designated fresh raw-only SymmetricTree versus immutable n016 raw-only Depthwise/min_data_in_leaf=1 and n014 raw-only SymmetricTree references; frozen search validation with 489,744 training and 104,945 scoring rows; 21 raw predictors including four native categories, without ID or target; 400-tree depth-8, L2=10, learning-rate-0.08 GPU Plain CatBoost, seed 20261004, RTX 2080 Ti physical index 1/logical device 0; 180-second cap; strict absolute proximity margin 0.0002.&quot;, &quot;supports&quot;: [&quot;e-15adc1988cb151046 tched raw control?&quot;, &quot;Can a controlled learning-rate/iteration trajectory or regularization setting improve practical ROC-AUC within the fixed time cap?&quot;, &quot;Is a distinct tree-growth policy feasible in the installed environment and useful under the frozen evaluation protocol?&quot;, &quot;Which configuration balances measured AUC and whole-CLI runtime under the frozen cap?&quot;], &quot;next_experiments&quot;: [&quot;Run a designated full-pool raw-versus-rating-level comparison with identical settings and frozen seed. This distinguishes equality-only feature utility from the historical raw anchor; retain the views only if the predeclared practical rule is met.&quot;, &quot;Compare a prespecified learning-rate/iteration trajectory with a matched fixed-iteration control. This distinguishes trajectory choice from extra compute or tree count; change the configuration only if validation meets the practical rule within the cap.&quot;, &quot;If pursuing Depthwise, verify installed-version GPU feasibility first, then evaluate a designated Depthwise treatment against a matched SymmetricTree control. This distinguishes a practical growth-policy alternative from a documentation-only rationale; change the decision only if it runs within budget and meets the practical criterion.&quot;, &quot;Do not interpret score changes as evidence of a feature or tree-growth mechanism without an identifying control; use paired recorded-seed comparisons where budget permits and preserve uncertainty when only fixed-seed results are available.&quot;]}, &quot;evidence&quot;: [{&quot;id&quot;: &quot;e-0230e1342ecdc9f92e56daad&quot;, &quot;kind&quot;: &quot;source&quot;, &quot;title&quot;: &quot;Training on GPU | CatBoost&quot;, &quot;observed_at&quot;: &quot;&quot;, &quot;captured_at&quot;: &quot;2026-10-04T15:53:49+00:00&quot;, &quot;source_url&quot;: &quot;https://catboost.ai/docs/en/features/training-on-gpu&quot;, &quot;attribution&quot;: &quot;Research-agent collected excerp
