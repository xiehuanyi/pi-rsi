<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="784" viewBox="0 0 1280 784" role="img" aria-labelledby="title desc"><title id="title">A research loop grounded in code, measurements and evidence</title><desc id="desc">Frozen task and root baseline feed an iterative research loop: choose a hypothesis, implement and officially evaluate it, analyze the result and retain evidence. Search tree, handoffs and the development research Wiki inform the next decision. A node inset shows coding, quick trials, official evaluation and audit. Budgets and recovery are controller responsibilities.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#223246" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1280" height="784" rx="20" fill="#ffffff"/><g font-family="Inter, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif"><text x="40" y="52" font-size="37" font-weight="700" fill="#223246" text-anchor="start">pi-rsi</text><text x="183" y="51" font-size="23" font-weight="400" fill="#63758a" text-anchor="start">A research loop grounded in code, measurements and evidence</text><rect x="40" y="87" width="360" height="91" rx="14" fill="#f7f9fc" stroke="#cfdae5" stroke-width="1.6"/><text x="62" y="120" font-size="24" font-weight="600" fill="#223246" text-anchor="start">Frozen task pack</text><text x="62" y="153" font-size="20" font-weight="400" fill="#63758a" text-anchor="start">Task · data · starter · evaluator</text><rect x="442" y="87" width="294" height="91" rx="14" fill="#f7f9fc" stroke="#cfdae5" stroke-width="1.6"/><text x="464" y="120" font-size="24" font-weight="600" fill="#223246" text-anchor="start">Root baseline</text><text x="464" y="153" font-size="20" font-weight="400" fill="#63758a" text-anchor="start">Record score + provenance</text><rect x="778" y="87" width="462" height="91" 