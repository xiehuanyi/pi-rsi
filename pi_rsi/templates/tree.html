<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1c;--muted:#6b6b6b;--panel:#ffffff;--line:#d9d9d4;--accent:#2f6fde;--ok:#2e9e5b;--warn:#d98a1f;--bad:#d64545;--gold:#c9a227;--run:#2f6fde;--plan:#9a9a9a;--code:#f0f0ec}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#ececec;--muted:#9aa0a6;--panel:#1f2126;--line:#33363d;--code:#26282e}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#ececec;--muted:#9aa0a6;--panel:#1f2126;--line:#33363d;--code:#26282e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-inline:16px;padding-block:12px;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:120px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:18px;font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(280px,2fr);gap:12px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.panel h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
#treewrap{overflow:auto;max-height:70vh}
svg text{font:12px system-ui,sans-serif;fill:var(--fg)}
.node rect{stroke-width:1.5;cursor:pointer}
.node.sel rect{stroke:var(--accent);stroke-width:3}
.edge{stroke:var(--line);stroke-width:1.5;fill:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle;background:var(--c)}
pre{background:var(--code);padding:8px;border-radius:6px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:40vh}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
tr.best td{font-weight:600}
.tag{display:inline-block;padding:1px 6px;border-radius:10px;font-size:11px;color:#fff;background:var(--plan)}
.tag.improved{background:var(--ok)}.tag.worse{background:var(--warn)}.tag.failed{background:var(--bad)}.tag.no_change{background:var(--plan)}.tag.running,.tag.evaluating{background:var(--run)}.tag.baseline{background:#444}
.muted{color:var(--muted)}
.tablewrap{overflow-x:auto}
</style>
</head>
<body>
__BACK__<h1 id="title"></h1>
<div class="sub" id="subtitle"></div>
<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="panel"><h2>Search tree</h2><div id="treewrap"><svg id="tree"></svg></div>
    <div class="legend"><span style="--c:var(--ok)">improved</span><span style="--c:var(--plan)">no change</span><span style="--c:var(--warn)">worse</span><span style="--c:var(--bad)">failed</span><span style="--c:var(--run)">running</span><span style="--c:var(--gold)">best</span></div>
  </div>
  <div class="panel"><h2>Node</h2><div id="detail" class="muted">Click a node.</div></div>
</div>
<div class="grid" style="margin-top:12px">
  <div class="panel"><h2>Score over finished nodes</h2><svg id="chart" width="100%" height="220"></svg></div>
  <div class="panel"><h2>Insights &amp; dead ends</h2><div class="tabs"><button class="on" data-t="insights">insights</button><button data-t="deadends">dead ends</button></div><pre id="idtext"></pre></div>
</div>
<div class="panel" style="margin-top:12px"><h2>All nodes</h2><div class="tablewrap"><table id="table"></table></div></div>
__SCRIPTS__
</body>
</html>
